<!doctype html>
<html lang="{{ language|default('ar') }}" dir="{{ 'ltr' if language in ['en','id','tr','fr','ms','ha'] else 'rtl' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>{% block title %}{{ hotel.name if hotel else 'ضيف' }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#0f3d2e; --brand-2:#14543f; --accent:#1c7a5a;
    --bg:#f2f5f3; --card:#fff; --ink:#132019; --ink-2:#5b6b63; --line:#e0e7e3;
    --bubble-in:#fff; --bubble-out:#d8f0e4; --gold:#8f6318; --gold-soft:#faf1dc;
    --danger:#a8321f; --radius:16px;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --bg:#0e1512; --card:#16201b; --ink:#e8efea; --ink-2:#9db0a6; --line:#26332c;
    --bubble-in:#1d2a23; --bubble-out:#1f4a39; --gold:#d9a94e; --gold-soft:#2b2312;
  }}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0e1512; --card:#16201b; --ink:#e8efea; --ink-2:#9db0a6; --line:#26332c;
    --bubble-in:#1d2a23; --bubble-out:#1f4a39; --gold:#d9a94e; --gold-soft:#2b2312;
  }}
  :root[data-theme="dark"]{
    --bg:#0e1512; --card:#16201b; --ink:#e8efea; --ink-2:#9db0a6; --line:#26332c;
    --bubble-in:#1d2a23; --bubble-out:#1f4a39; --gold:#d9a94e; --gold-soft:#2b2312;
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0}
  body{
    font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); min-height:100dvh;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 16px; min-height:100dvh;
    display:flex; flex-direction:column}
  .topbar{display:flex; align-items:center; gap:11px; padding:14px 0 12px}
  .mark{width:42px; height:42px; border-radius:12px; background:var(--brand);
    color:#fff; display:grid; place-items:center; font-weight:700; font-size:1.05rem; flex:none}
  .topbar h1{margin:0; font-size:1.02rem; font-weight:700; line-height:1.3}
  .topbar .sub{font-size:.8rem; color:var(--ink-2)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .btn{font:inherit; font-size:.95rem; font-weight:600; border-radius:12px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    padding:12px 16px; cursor:pointer; min-height:46px}
  .btn.p{background:var(--brand); border-color:var(--brand); color:#fff}
  .btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  input, select{font:inherit; font-size:1rem; width:100%; padding:13px 14px;
    border-radius:12px; border:1px solid var(--line); background:var(--card);
    color:var(--ink); min-height:48px}
  input:focus-visible, select:focus-visible{outline:3px solid var(--accent); outline-offset:1px}
  label{display:block; font-size:.88rem; font-weight:600; margin-bottom:7px}
  .err{background:color-mix(in srgb,var(--danger) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);
    color:var(--danger); border-radius:12px; padding:11px 14px; font-size:.9rem; margin-bottom:14px}
  .muted{color:var(--ink-2); font-size:.86rem; line-height:1.6}
  footer{padding:16px 0 22px; text-align:center; font-size:.76rem; color:var(--ink-2)}
  {% block style %}{% endblock %}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="mark">{{ (hotel.name[:1] if hotel else 'ض') }}</div>
    <div>
      <h1>{{ hotel.name if hotel else 'ضيف' }}</h1>
      <div class="sub">{% block subtitle %}{% endblock %}</div>
    </div>
  </div>
  {% block body %}{% endblock %}
  <footer>مدعوم بـ ضيف</footer>
</div>
{% block script %}{% endblock %}
</body>
</html>
