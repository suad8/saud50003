[project]
name = "daif"
version = "0.1.0"
description = "ضيف — مساعد النزلاء الذكي لفنادق الحرمين، منصة SaaS متعددة الفنادق"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.2.0",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["daif*"]
