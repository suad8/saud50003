# قاعدة معرفة تجريبية — فندق طيبة (نموذج للتهيئة الأولى لأي فندق جديد)
#
# الحقول:
#   id          معرّف ثابت. يُستشهد به في كل جواب. لا يُعاد استخدامه أبدًا بعد الحذف.
#   text        نص الحقيقة كما تُقال للنزيل. بالعربي — النموذج يترجمها للغته.
#   topic       تصنيف داخلي للوحة التحكم فقط.
#   season      normal | ramadan | hajj — تُعرض في هذه المواسم فقط.
#   hours       نافذة تشغيل يومية. النظام يحسب «مفتوح/مغلق الآن» تلقائيًا.
#   valid_from  /  valid_until   صلاحية مؤقتة. بعد الانتهاء تختفي الحقيقة تلقائيًا.
#   paid        خدمة مدفوعة — تُذكر مرة واحدة فقط وعند الحاجة.

- id: K01
  topic: wifi
  text: "الواي فاي: الشبكة Taibah-Guest، كلمة السر welcome2026."

- id: K02
  topic: breakfast
  season: [normal, hajj]
  hours: "05:30-10:30"
  text: "الإفطار من ٥:٣٠ إلى ١٠:٣٠ صباحًا في مطعم الروضة، الدور الأول."

- id: K03
  topic: dinner
  season: [normal, hajj]
  hours: "19:00-22:30"
  text: "العشاء من ٧:٠٠ إلى ١٠:٣٠ مساءً في مطعم الروضة، الدور الأول."

- id: K04
  topic: suhoor
  season: [ramadan]
  hours: "01:30-04:15"
  text: "السحور من ١:٣٠ إلى ٤:١٥ فجرًا في مطعم الروضة، الدور الأول."

- id: K05
  topic: iftar
  season: [ramadan]
  text: "الإفطار يُقدَّم عند أذان المغرب في مطعم الروضة والقاعة الكبرى، الدور الأول. يُفتح الباب قبل الأذان بنصف ساعة."

- id: K06
  topic: haram_gate
  text: "أقرب باب للحرم: باب الملك فهد رقم ٢١، ٧ دقائق مشيًا. اخرج واتجه يمينًا ثم مستقيم."

- id: K07
  topic: haram_gate
  text: "أقرب باب للنساء: باب عثمان بن عفان رقم ١٠، ٩ دقائق مشيًا. اخرج واتجه يسارًا ثم أول تقاطع يمينًا."

- id: K08
  topic: checkin_checkout
  text: "تسجيل الدخول من الساعة ٣ عصرًا. تسجيل الخروج قبل الساعة ١٢ ظهرًا."

- id: K09
  topic: housekeeping
  hours: "08:00-16:00"
  text: "التنظيف اليومي من ٨ صباحًا إلى ٤ عصرًا. للمناشف والمستلزمات اتصل بالتدبير الفندقي على التحويلة ٤."

- id: K10
  topic: laundry
  paid: true
  text: "غسيل الملابس: التسليم قبل ١٠ صباحًا يعود في نفس اليوم مساءً. الثوب ١٥ ريالًا، القطعة العادية ٨ ريالات."

- id: K11
  topic: luggage
  text: "حفظ الأمتعة متاح مجانًا في مستودع الاستقبال يوم المغادرة حتى ١٠ مساءً."

- id: K12
  topic: airport_transfer
  paid: true
  text: "نقل المطار بحجز مسبق ٤ ساعات، ٢٥٠ ريالًا للسيارة حتى ٤ ركاب."

- id: K13
  topic: wheelchair
  text: "كرسي متحرك متاح مجانًا من الاستقبال حسب التوفر، ويُطلب قبل ساعة."

- id: K14
  topic: zamzam
  text: "ماء زمزم متوفر مجانًا في بردات كل دور، بجانب المصاعد."

- id: K15
  topic: prayer_room
  text: "مصلى الفندق في الدور الأرضي خلف الاستقبال، ومصلى النساء في الدور الأول."

- id: K16
  topic: parking
  paid: true
  text: "موقف السيارات في القبو، ٣٠ ريالًا لليوم، والدخول من شارع أبي ذر."

- id: K17
  topic: late_checkout
  paid: true
  text: "تأخير الخروج حتى ٦ مساءً بنصف قيمة الليلة، حسب التوفر، ويُطلب قبل ١٠ صباحًا."

- id: K18
  topic: reception
  text: "الاستقبال يعمل ٢٤ ساعة. التحويلة ٩ من هاتف الغرفة."

- id: K19
  topic: elevators
  text: "أربعة مصاعد في البهو الرئيسي، اثنان منها يخدمان الأدوار من ١ إلى ٨."

- id: K20
  topic: groups
  text: "مجموعات العمرة: قاعة الاجتماع في الدور الأول متاحة للمطوّفين بحجز مسبق من الاستقبال."

- id: K21
  topic: pool
  season: [normal]
  valid_until: "2026-12-31"
  hours: "07:00-21:00"
  text: "المسبح في الدور الثامن من ٧ صباحًا إلى ٩ مساءً، ومخصص للرجال."
